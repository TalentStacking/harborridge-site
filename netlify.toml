[build]
  command = "node scripts/build-rss.js"
  publish = "."

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/contact"
  to = "/#contact"
  status = 301
  force = true

[[redirects]]
  from = "/team"
  to = "/#team"
  status = 301
  force = true

# Internal automation docs and project notes: not part of the public site
[[redirects]]
  from = "/comps-ops/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/CLAUDE.md"
  to = "/404.html"
  status = 404
  force = true
